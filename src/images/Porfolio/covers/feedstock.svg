    <path d="M492 252h48" stroke-width="8" opacity=".75"/>
    <rect x="492" y="276" width="136" height="16" rx="4"/>
    <path d="M492 284h26" stroke-width="8" opacity=".75"/>
    <path d="M492 312h136" stroke-width="2" opacity=".5"/>
    <path d="M492 330h50M598 330h30" stroke-width="3"/>
    <!-- the shock: the input moves, the unit cost moves with it -->
    <path d="M664 250h30" opacity=".55"/>
    <circle cx="726" cy="250" r="32" fill="#0B0D11"/>
    <path d="M726 234v32M712 250h28" stroke-width="2.5" opacity=".45"/>
