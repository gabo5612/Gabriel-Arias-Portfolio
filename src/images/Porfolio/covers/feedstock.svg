    <path d="M290 150v180" stroke-width="2" stroke-dasharray="6 7" opacity=".6"/>
    <path d="M290 218l34-18 32 10" stroke-width="2.5" stroke-dasharray="8 6" opacity=".8"/>
    <circle cx="290" cy="218" r="6" fill="#0B0D11"/>
    <!-- the basket: what one unit of product costs, input by input -->
    <path d="M418 250h34" opacity=".55"/>
    <rect x="470" y="150" width="180" height="200" rx="12"/>
    <path d="M492 190h60" stroke-width="2"/>
    <rect x="492" y="212" width="136" height="16" rx="4"/>
