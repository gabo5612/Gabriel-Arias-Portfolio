<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <pattern id="gf" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#161b26" stroke-width="1"/>
    </pattern>
    <radialGradient id="wf" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#0B0D11"/>
  <rect width="800" height="500" fill="url(#gf)"/>
  <rect width="800" height="500" fill="url(#wf)"/>
  <g fill="none" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
