<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
  <defs>
    <pattern id="gg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#161b26" stroke-width="1"/>
    </pattern>
    <radialGradient id="wg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="#0B0D11"/>
  <rect width="800" height="500" fill="url(#gg)"/>
  <rect width="800" height="500" fill="url(#wg)"/>
  <g fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- the golden set: questions, one of them a negative control -->
    <rect x="80" y="150" width="150" height="200" rx="10"/>
    <path d="M100 184h96M100 208h110M100 232h84M100 256h104M100 280h72" stroke-width="2" opacity=".7"/>
